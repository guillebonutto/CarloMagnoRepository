{% extends 'base.html' %}
{% block title %}Contraseña Cambiada - Carlo Magno{% endblock %}

{% block extra_css %}
<style>
    .auth-container {
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f5f5f5 0%, #e0e0e0 100%);
        padding: 40px 20px;
    }
    .auth-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        max-width: 450px;
        width: 100%;
        text-align: center;
        padding: 50px 40px;
    }
    .success-icon {
        width: 90px; height: 90px;
        border-radius: 50%;
        background: linear-gradient(135deg, #2e7d32, #43a047);
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 25px;
        font-size: 2.5rem; color: white;
        animation: pop 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    @keyframes pop {
        0% { transform: scale(0); }
        80% { transform: scale(1.1); }
        100% { transform: scale(1); }
    }
    .auth-card h2 { font-size: 26px; font-weight: 700; color: #111; margin-bottom: 12px; }
    .auth-card p { color: #666; line-height: 1.7; }
    .btn-login {
        display: inline-block;
        margin-top: 25px;
        padding: 14px 40px;
        background: linear-gradient(135deg, #8B0000, #a00000);
        color: white;
        border-radius: 50px;
        text-decoration: none;
        font-weight: 700;
        font-size: 0.95rem;
        letter-spacing: 1px;
        text-transform: uppercase;
        transition: all 0.3s;
    }
    .btn-login:hover { color: white; transform: translateY(-2px); box-shadow: 0 8px 20px rgba(139,0,0,0.3); }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="success-icon">
            <i class="fas fa-check"></i>
        </div>
        <h2>¡Contraseña cambiada!</h2>
        <p>Tu contraseña fue restablecida exitosamente.<br>Ya podés iniciar sesión con tu nueva contraseña.</p>
        <a href="{% url 'login_cliente' %}" class="btn-login">
            <i class="fas fa-sign-in-alt me-2"></i> Iniciar sesión
        </a>
    </div>
</div>
{% endblock %}
