{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container my-5 py-5 text-center">
    <div class="card shadow p-5 border-0 mx-auto" style="max-width: 600px; border-radius: 20px;">
        <div class="mb-4">
            <i class="fas fa-times-circle text-danger" style="font-size: 80px;"></i>
        </div>
        <h1 class="display-5 fw-bold mb-3">Pago no realizado</h1>
        <p class="lead text-muted mb-4">
            Lo sentimos, hubo un problema al procesar tu pago. No se ha realizado ningún cargo en tu cuenta.
        </p>
        <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
            <a href="{% url 'inicio' %}" class="btn btn-outline-secondary btn-lg px-4">
                Volver al inicio
            </a>
            <button onclick="window.history.back()" class="btn btn-primary btn-lg px-4 gap-3" style="background-color: #8b0000; border-color: #8b0000;">
                Intentar nuevamente
            </button>
        </div>
    </div>
</div>
{% endblock %}
